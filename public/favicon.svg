<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
    <linearGradient id="pageGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#FEF3C7" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#78350F" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Rounded App Tile -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" />

  <!-- Inner Soft Glow Border -->
  <rect x="1.5" y="1.5" width="61" height="61" rx="14.5" stroke="#FDE68A" stroke-opacity="0.35" stroke-width="2" />

  <!-- Book Base Pages -->
  <g filter="url(#shadow)">
    <!-- Left Page -->
    <path d="M14 20C20 18 29 19 32 23V46C28 42 19 41 14 43V20Z" fill="url(#pageGrad)" stroke="#B45309" stroke-width="0.75" />
    <!-- Right Page -->
    <path d="M50 20C44 18 35 19 32 23V46C36 42 45 41 50 43V20Z" fill="url(#pageGrad)" stroke="#B45309" stroke-width="0.75" />
    <!-- Center Spine Spine Line -->
    <path d="M32 23V46" stroke="#92400E" stroke-width="1.5" stroke-linecap="round" />
  </g>

  <!-- Book Lines on Pages -->
  <path d="M19 26C23 25 27 25.5 29 27" stroke="#D97706" stroke-width="1.5" stroke-linecap="round" />
  <path d="M19 31C23 30 27 30.5 29 32" stroke="#D97706" stroke-width="1.5" stroke-linecap="round" />
  <path d="M19 36C23 35 27 35.5 29 37" stroke="#D97706" stroke-width="1.5" stroke-linecap="round" />

  <path d="M45 26C41 25 37 25.5 35 27" stroke="#D97706" stroke-width="1.5" stroke-linecap="round" />
  <path d="M45 31C41 30 37 30.5 35 32" stroke="#D97706" stroke-width="1.5" stroke-linecap="round" />
  <path d="M45 36C41 35 37 35.5 35 37" stroke="#D97706" stroke-width="1.5" stroke-linecap="round" />

  <!-- Soundwave / Sparkle representing Audio Narration -->
  <!-- Floating Sparkle / Audio Arc at Top Center -->
  <path d="M32 10L33.5 14L37.5 15.5L33.5 17L32 21L30.5 17L26.5 15.5L30.5 14L32 10Z" fill="#FEF08A" />
  <!-- Mini Audio Pulsing Waves -->
  <path d="M41 12C43.5 14 43.5 17 41 19" stroke="#FEF3C7" stroke-width="1.75" stroke-linecap="round" />
  <path d="M23 12C20.5 14 20.5 17 23 19" stroke="#FEF3C7" stroke-width="1.75" stroke-linecap="round" />
</svg>
